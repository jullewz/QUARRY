[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-db"
dynamic = ["version"]
description = "A relational database engine written from scratch in pure Python: B+trees, a write-ahead log and SQLite-compatible SQL."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jullewz" }]
maintainers = [{ name = "jullewz" }]
keywords = ["database", "sql", "sqlite", "b-tree", "write-ahead-log", "query-planner", "dbapi", "embedded-database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/jullewz/quarry"
Documentation = "https://github.com/jullewz/quarry/tree/main/docs"
Issues = "https://github.com/jullewz/quarry/issues"
Changelog = "https://github.com/jullewz/quarry/blob/main/CHANGELOG.md"

[project.scripts]
quarry = "quarry.shell:main"

[tool.setuptools.dynamic]
version = { attr = "quarry.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quarry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "B023", "B905", "UP031", "B904", "UP007"]
